services:
  - type: web
    name: melios-dira-odds
    runtime: python
    rootDir: v4_web
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FOOTBALLDATA_ORG_KEY
        sync: false
      - key: BBS_API_KEY
        sync: false
      - key: PARSE_BOT_KEY
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: ALLOWED_HOSTS
        value: melios-dira-odds.onrender.com
      - key: FAN_VOTE_RETENTION_DAYS
        value: "90"
      - key: PUBLIC_BASE_URL
        value: https://melios-dira-odds.onrender.com
