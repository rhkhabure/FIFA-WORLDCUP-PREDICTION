<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V3 Universal Football Model</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --color-primary: {{ theme.primary }};
            --color-secondary: {{ theme.secondary }};
            --color-bg: {{ theme.bg }};
        }
        body {
            background-color: var(--color-bg);
            color: #FAFAFA;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }
        /* Sidebar styling */
        .sidebar {
            width: 250px;
            background-color: #050810;
            border-right: 2px solid var(--color-primary);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
        }
        h1, h2, h3, h4 {
            color: var(--color-primary);
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .text-primary-custom { color: var(--color-primary); }
        .bg-primary-custom { background-color: var(--color-primary); }
        .border-primary-custom { border-color: var(--color-primary); }
        
        .metric-card {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--color-primary);
        }
        .nav-link {
            display: block;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            color: #ccc;
            text-decoration: none;
            transition: all 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            background-color: var(--color-primary);
            color: #fff;
        }
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 20px;
            background-color: #111;
            color: white;
            border: 1px solid #333;
            border-radius: 4px;
        }
        hr {
            border-color: var(--color-secondary);
            opacity: 0.5;
            margin: 30px 0;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 class="text-xl mb-6 flex items-center gap-2">⚽ V3 Model</h2>
        
        <form action="/" method="get" id="nav-form">
            <label class="text-sm text-gray-400">Select League</label>
            <select name="league" onchange="document.getElementById('nav-form').submit()">
                {% for l in leagues %}
                    <option value="{{ l }}" {% if l == current_league %}selected{% endif %}>{{ l }}</option>
                {% endfor %}
            </select>
            
            <label class="text-sm text-gray-400">Select Team Theme</label>
            <select name="team" onchange="document.getElementById('nav-form').submit()">
                <option value="Default">Default</option>
                {% for t in available_teams %}
                    <option value="{{ t }}" {% if t == current_team %}selected{% endif %}>{{ t }}</option>
                {% endfor %}
            </select>
        </form>

        <div class="mt-8">
            <a href="/?league={{ current_league }}&team={{ current_team }}" class="nav-link {% if active_page == 'hub' %}active{% endif %}">🌍 League Hub</a>
            <a href="/match?league={{ current_league }}&team={{ current_team }}" class="nav-link {% if active_page == 'match' %}active{% endif %}">🔴 Live Match</a>
            <a href="/team?league={{ current_league }}&team={{ current_team }}" class="nav-link {% if active_page == 'team' %}active{% endif %}">🏟️ Team Profile</a>
        </div>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
